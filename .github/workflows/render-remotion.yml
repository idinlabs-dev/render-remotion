name: Render Remotion

on:
  push:
    paths:
      - "projects/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Nama project (folder atau file .zip di projects/). Kosong = semua"
        required: false
        default: ""
      composition:
        description: "ID composition (kosong = otomatis atau dari render.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tentukan project yang dirender
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PROJECT_INPUT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          names=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$PROJECT_INPUT" ]; then
            names="${PROJECT_INPUT%.zip}"
          elif [ "$EVENT" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            names=$(git diff --name-only "$BEFORE" "$SHA" -- projects | grep '^projects/' | cut -d/ -f2 | sed 's/\.zip$//' | sort -u || true)
          else
            names=$(git ls-files projects | grep '^projects/' | cut -d/ -f2 | sed 's/\.zip$//' | sort -u || true)
          fi
          valid=()
          for n in $names; do
            [[ "$n" =~ ^[A-Za-z0-9._-]+$ ]] || continue
            if [ -f "projects/$n/package.json" ] || [ -f "projects/$n.zip" ]; then valid+=("$n"); fi
          done
          if [ "${#valid[@]}" -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo 'any=false' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${valid[@]}" | jq -R . | jq -sc .)
            echo "matrix=$json" >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Siapkan folder project
        env:
          P: ${{ matrix.project }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ -f "projects/$P.zip" ]; then
            mkdir -p work/_tmp
            unzip -q -o "projects/$P.zip" -d work/_tmp
            rm -rf work/_tmp/__MACOSX
            if [ ! -f work/_tmp/package.json ] && [ "$(find work/_tmp -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
              child=$(find work/_tmp -mindepth 1 -maxdepth 1 -type d -print -quit)
              if [ -n "$child" ] && [ -f "$child/package.json" ]; then mv "$child" "work/$P"; else mv work/_tmp "work/$P"; fi
            else
              mv work/_tmp "work/$P"
            fi
          else
            cp -r "projects/$P" "work/$P"
          fi
          test -f "work/$P/package.json"

      - name: Install library sistem untuk Chrome dan ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2
      - name: Install dependensi project
        working-directory: work/${{ matrix.project }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx remotion browser ensure
      - name: Render video
        working-directory: work/${{ matrix.project }}
        env:
          P: ${{ matrix.project }}
          COMP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.composition || '' }}
        run: |
          set -euo pipefail
          cfg() { if [ -f render.json ]; then jq -r "$1" render.json 2>/dev/null || true; fi; }
          ENTRY=$(cfg '.entry // empty')
          if [ -z "$ENTRY" ]; then for f in src/index.ts src/index.tsx src/index.js src/index.jsx; do [ -f "$f" ] && ENTRY="$f" && break; done; fi
          [ -n "$ENTRY" ] || { echo "Entry Remotion tidak ditemukan"; exit 1; }
          COMPOSITIONS=$(npx remotion compositions "$ENTRY" --quiet | tail -n 1 | tr ' ' '\n' | grep -v '^$' || true)
          [ -n "$COMPOSITIONS" ] || { echo "Composition tidak ditemukan"; exit 1; }
          COMP="$COMP_INPUT"; CONFIG_COMP=$(cfg '.composition // empty')
          [ -n "$COMP" ] || COMP="$CONFIG_COMP"
          [ -n "$COMP" ] || COMP=$(printf '%s\n' "$COMPOSITIONS" | head -n1)
          if ! printf '%s\n' "$COMPOSITIONS" | grep -Fxq -- "$COMP"; then echo "Composition tidak valid: $COMP"; exit 1; fi
          EXTRA=$(cfg '(.args // []) | join(" ")')
          mkdir -p out
          npx remotion render "$ENTRY" "$COMP" "out/$P.mp4" --codec=h264 $EXTRA
          test -s "out/$P.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.project }}
          path: work/${{ matrix.project }}/out/*.mp4
          retention-days: 14
      - name: Publish ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          P: ${{ matrix.project }}
          RUN: ${{ github.run_number }}
        run: gh release create "render-$P-$RUN" "work/$P/out/$P.mp4" --title "Render $P #$RUN" --notes "Hasil render otomatis dari projects/$P."
