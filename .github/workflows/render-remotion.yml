name: Render Remotion Split
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Nama ZIP atau folder di projects/"
        required: true
        default: "peter-episode1"
      composition:
        description: "ID composition; kosong mengikuti render.json"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Siapkan project
        env: {P: ${{ inputs.project }}}
        run: |
          set -euo pipefail
          P="${P%.zip}"; mkdir -p work
          if [ -f "projects/$P.zip" ]; then unzip -q -o "projects/$P.zip" -d work/_tmp; rm -rf work/_tmp/__MACOSX; if [ -f work/_tmp/package.json ]; then mv work/_tmp "work/$P"; else child=$(find work/_tmp -mindepth 1 -maxdepth 1 -type d -print -quit); mv "$child" "work/$P"; fi; else cp -r "projects/$P" "work/$P"; fi
          test -f "work/$P/package.json"
          echo "P=$P" >> "$GITHUB_ENV"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2
      - name: Install dependencies
        working-directory: work/${{ env.P }}
        run: npm install && npx remotion browser ensure
      - name: Render split segments and concat
        working-directory: work/${{ env.P }}
        env: {COMP_INPUT: ${{ inputs.composition }}}
        run: |
          set -euo pipefail
          cfg(){ if [ -f render.json ]; then jq -r "$1" render.json 2>/dev/null || true; fi; }
          ENTRY=$(cfg '.entry // empty'); [ -n "$ENTRY" ] || ENTRY=src/index.ts
          COMP="$COMP_INPUT"; [ -n "$COMP" ] || COMP=$(cfg '.composition // empty'); [ -n "$COMP" ] || COMP=$(npx remotion compositions "$ENTRY" --quiet | tail -n 1 | tr ' ' '\n' | head -n 1)
          FPS=$(npx remotion compositions "$ENTRY" --quiet | tail -n 1 >/dev/null; node -e "console.log(30)")
          DURATION=$(node -e "const t=require('./src/timing.json'); console.log(t.duration)")
          SEG=$(cfg '.segmentSeconds // 60'); TOTAL=$(node -e "console.log(Math.ceil($DURATION*$FPS))"); CHUNK=$(node -e "console.log(Math.ceil($SEG*$FPS))")
          mkdir -p out/parts; : > out/concat.txt
          i=0; start=0
          while [ "$start" -lt "$TOTAL" ]; do end=$((start+CHUNK-1)); [ "$end" -lt "$TOTAL" ] || end=$((TOTAL-1)); file="out/parts/part-$(printf '%04d' "$i").mp4"; echo "Rendering frames $start-$end"; npx remotion render "$ENTRY" "$COMP" "$file" --codec=h264 --frames="$start-$end" --gl=swangle --timeout=120000; test -s "$file"; printf "file '%s'\n" "$(pwd)/$file" >> out/concat.txt; start=$((end+1)); i=$((i+1)); done
          ffmpeg -y -f concat -safe 0 -i out/concat.txt -c copy "out/$P.mp4"
          test -s "out/$P.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ env.P }}
          path: work/${{ env.P }}/out/${{ env.P }}.mp4
          retention-days: 14
