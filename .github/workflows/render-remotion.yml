name: Render Remotion Split

on:
  push:
    paths:
      - "projects/**"
      - ".github/workflows/render-remotion.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Nama ZIP atau folder di projects/; kosong = otomatis pilih ZIP terbaru/berubah"
        required: false
        default: ""
      composition:
        description: "ID composition; kosong = baca render.json"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare project
        env:
          REQUESTED_PROJECT: ${{ inputs.project }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          P="${REQUESTED_PROJECT:-}"
          P="${P%.zip}"

          if [ -z "$P" ] && [ "$EVENT_NAME" = "push" ]; then
            changed=""
            if [ -n "${EVENT_BEFORE:-}" ] && ! printf '%s' "$EVENT_BEFORE" | grep -q '^0\{40\}$'; then
              changed=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- 'projects/*.zip' || true)
            fi
            P=$(printf '%s\n' "$changed" | awk -F/ 'NF == 2 {sub(/\.zip$/, "", $2); print $2; exit}')
          fi

          if [ -z "$P" ]; then
            P=$(find projects -maxdepth 1 -type f -name '*.zip' -printf '%T@ %f\n' | sort -nr | head -n 1 | sed 's/^[^ ]* //' | sed 's/\.zip$//')
          fi

          test -n "$P" || { echo 'Tidak ada project ZIP di projects/'; exit 1; }
          printf '%s' "$P" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "Nama project tidak valid: $P"; exit 1; }
          mkdir -p work

          if [ -f "projects/$P.zip" ]; then
            rm -rf work/_tmp "work/$P"
            mkdir -p work/_tmp
            unzip -q -o "projects/$P.zip" -d work/_tmp
            rm -rf work/_tmp/__MACOSX
            if [ -f work/_tmp/package.json ]; then
              mv work/_tmp "work/$P"
            else
              child=$(find work/_tmp -mindepth 1 -maxdepth 1 -type d -print -quit)
              test -n "$child"
              mv "$child" "work/$P"
            fi
          elif [ -d "projects/$P" ]; then
            cp -r "projects/$P" "work/$P"
          else
            echo "Project tidak ditemukan: projects/$P.zip atau projects/$P"
            exit 1
          fi

          test -f "work/$P/package.json"
          echo "P=$P" >> "$GITHUB_ENV"
          echo "PROJECT=$P"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libpango-1.0-0 libcairo2

      - name: Install dependencies
        run: |
          cd "work/$P"
          npm install
          npx remotion browser ensure

      - name: Render split segments and concat
        env:
          REQUESTED_COMPOSITION: ${{ inputs.composition }}
        run: |
          set -euo pipefail
          cd "work/$P"
          cfg() { if [ -f render.json ]; then jq -r "$1" render.json 2>/dev/null || true; fi; }
          ENTRY=$(cfg '.entry // empty')
          [ -n "$ENTRY" ] || ENTRY="src/index.tsx"
          COMP="${REQUESTED_COMPOSITION:-}"
          [ -n "$COMP" ] || COMP=$(cfg '.composition // empty')
          [ -n "$COMP" ] || COMP="Main"
          FPS=$(cfg '.fps // 30')
          DURATION=$(node -e "const t=require('./src/timing.json'); console.log(t.duration)")
          SEG=$(cfg '.segmentSeconds // 60')
          TOTAL=$(node -e "console.log(Math.ceil($DURATION*$FPS))")
          CHUNK=$(node -e "console.log(Math.ceil($SEG*$FPS))")
          mkdir -p out/parts
          : > out/concat.txt
          i=0
          start=0
          while [ "$start" -lt "$TOTAL" ]; do
            end=$((start + CHUNK - 1))
            [ "$end" -lt "$TOTAL" ] || end=$((TOTAL - 1))
            file="out/parts/part-$(printf '%04d' "$i").mp4"
            echo "Rendering $P / $COMP frames $start-$end"
            npx remotion render "$ENTRY" "$COMP" "$file" --codec=h264 --frames="$start-$end" --gl=swangle --timeout=120000
            test -s "$file"
            printf "file '%s'\n" "$(pwd)/$file" >> out/concat.txt
            start=$((end + 1))
            i=$((i + 1))
          done
          ffmpeg -y -f concat -safe 0 -i out/concat.txt -c copy "out/$P.mp4"
          test -s "out/$P.mp4"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ env.P }}
          path: work/${{ env.P }}/out/${{ env.P }}.mp4
          if-no-files-found: error
          retention-days: 14
